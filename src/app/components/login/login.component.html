<div class="auth-shell">
  <div class="auth-card">
    <div class="brand-panel">
      <span class="brand-badge">E-Commerce</span>
      <h1>Welcome back</h1>
      <p>Sign in to continue shopping, managing your cart, and exploring the best deals.</p>
      <ul class="feature-list">
        <li>Fast checkout</li>
        <li>Exclusive offers</li>
        <li>Personal account</li>
      </ul>
    </div>

    <form class="auth-form" (ngSubmit)="login()">
      <div class="form-header">
        <h2>Login</h2>
        <p>Enter your details to access your account.</p>
      </div>

      <label>
        <span>Username</span>
        <input type="text" [(ngModel)]="username" name="username" placeholder="Enter your username" />
      </label>

      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" />
      </label>

      <div class="row-inline">
        <label class="remember-me">
          <input type="checkbox" />
          <span>Remember me</span>
        </label>
        <a href="javascript:void(0)" class="text-link">Forgot password?</a>
      </div>

      <button type="submit" class="primary-btn">Login</button>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <div class="switch-link">
        <span>Not a member yet?</span>
        <a routerLink="/register">Register</a>
      </div>
    </form>
  </div>
</div>
