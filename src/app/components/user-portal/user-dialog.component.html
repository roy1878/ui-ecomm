<div class="modal-backdrop" *ngIf="visible">
  <div class="dialog-card">
    <div class="dialog-header">
      <h3>{{ user?.id ? 'Edit User' : 'New User' }}</h3>
      <button class="close" (click)="close.emit()">✕</button>
    </div>

    <div class="dialog-body">
      <label>
        <span>First Name</span>
        <input [(ngModel)]="user!.FirstName" />
      </label>
      <label>
        <span>Last Name</span>
        <input [(ngModel)]="user!.LastName" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" [(ngModel)]="user!.email" />
      </label>
      <fieldset>
        <legend>Address</legend>
        <label>
          <span>City</span>
          <input [(ngModel)]="user!.userAddress.city" />
        </label>
        <label>
          <span>State</span>
          <input [(ngModel)]="user!.userAddress.state" />
        </label>
        <label>
          <span>Pincode</span>
          <input [(ngModel)]="user!.userAddress.pincode" />
        </label>
        <label>
          <span>Country</span>
          <input [(ngModel)]="user!.userAddress.country" />
        </label>
      </fieldset>
    </div>

    <div class="dialog-footer">
      <button class="secondary" type="button" (click)="close.emit()">Cancel</button>
      <button class="primary" type="button" (click)="onSave()">Save</button>
    </div>
  </div>
</div>
