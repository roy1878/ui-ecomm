<nav>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/users" routerLinkActive="active">User Portal</a>
    <a routerLink="/products" routerLinkActive="active">Product Dashboard</a>
    <a routerLink="/cart" routerLinkActive="active">Cart Dashboard</a>
  </div>
  <div class="nav-actions">
    <span *ngIf="currentUserName">Hello, {{ currentUserName }}</span>
    <a *ngIf="!currentUserName" routerLink="/login">Login</a>
    <button *ngIf="currentUserName" type="button" (click)="logout()">Logout</button>
  </div>
</nav>
<main>
  <div class="global-loader" *ngIf="isLoading$ | async">
    <div class="loader-card">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
  </div>
  <router-outlet></router-outlet>
</main>
